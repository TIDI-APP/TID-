<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIDI Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/dashboard.css">
  <style>
    .chat-wrapper {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 80px);
      max-height: calc(100dvh - 80px);
    }

    .chat-messages {
      flex: 1 1 0;
      overflow-y: auto;
      padding: 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .chat-bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 0.92rem;
      word-break: break-word;
      animation: bubbleIn 0.2s ease;
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .chat-bubble.bot {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.user {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      width: fit-content;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      animation: typing 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .chat-input-container {
      background: var(--card);
      padding: 10px 12px;
      border-radius: 20px;
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.07);
      margin-top: 10px;
      flex-shrink: 0;
    }

    .chat-input {
      background: transparent;
      border: none;
      color: white;
      flex-grow: 1;
      padding: 8px 6px;
      font-size: 0.92rem;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
    }

    .chat-input::placeholder { color: rgba(255,255,255,0.3); }
    .chat-input:focus { outline: none; }

    .btn-send {
      background: var(--primary);
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .2s;
      cursor: pointer;
    }

    .btn-send:hover { opacity: 0.85; transform: scale(1.05); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .bot-avatar {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      align-self: flex-end;
      margin-right: 6px;
    }

    .msg-row { display: flex; align-items: flex-end; }
    .msg-row.user { justify-content: flex-end; }
  </style>
  <link rel="manifest" href="/public/manifest.json">
  <link rel="apple-touch-icon" href="/public/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#6840f3">
</head>

<body>

  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- SIDEBAR DESKTOP -->
  <div class="desktop-sidebar d-none d-lg-block">
    <div class="sidebar-header"><h5>Tidi</h5></div>
    <div class="sidebar-links">
      <a href="dashboard.html"><i class="bi bi-house"></i> Inicio</a>
      <a href="chatbot.html" class="active"><i class="bi bi-robot"></i> Chatbot</a>
      <a href="transactions.html"><i class="bi bi-list-ul"></i> Transacciones</a>
      <a href="crediturbo.html"><i class="bi bi-lightning-charge"></i> Crediturbo</a>
      <a href="config.html"><i class="bi bi-gear"></i> Configuración</a>
      <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
    </div>
  </div>

  <!-- SIDEBAR MOBILE -->
  <div class="mobile-sidebar" id="mobileSidebar">
    <div class="sidebar-header">
      <h5>Tidi</h5>
      <i class="bi bi-x-lg close-btn" id="closeSidebar"></i>
    </div>
    <div class="sidebar-links">
      <a href="dashboard.html"><i class="bi bi-house"></i> Inicio</a>
      <a href="chatbot.html" class="active"><i class="bi bi-robot"></i> Chatbot</a>
      <a href="transactions.html"><i class="bi bi-list-ul"></i> Transacciones</a>
      <a href="crediturbo.html"><i class="bi bi-lightning-charge"></i> Crediturbo</a>
      <a href="config.html"><i class="bi bi-gear"></i> Configuración</a>
      <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="app-content" style="display:flex; flex-direction:column; height:100dvh; padding-bottom:0;">

    <!-- HEADER -->
    <div class="d-flex align-items-center gap-3 mb-3" style="flex-shrink:0;">
      <i class="bi bi-list d-lg-none" id="menuToggle" style="font-size:26px; cursor:pointer;"></i>
      <div>
        <h5 class="mb-0">Tidi AI</h5>
        <small class="opacity-50" style="font-size:0.75rem;">Asistente financiero</small>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat-wrapper">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-container">
        <textarea class="chat-input" id="messageInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
        <button class="btn-send" id="btnSend">
          <i class="bi bi-send-fill" style="font-size:15px;"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Bottom Bar (Mobile) -->
  <div class="bottom-container d-lg-none">
    <div class="bottom-bar">
      <div class="nav-item" style="cursor:pointer;" onclick="window.location.href='dashboard.html'">
        <i class="bi bi-house"></i>
      </div>
      <div class="nav-item" style="cursor:pointer; color: var(--primary-light);">
        <i class="bi bi-robot"></i>
      </div>
      <div class="spacer"></div>
      <div class="nav-item" style="cursor:pointer;" onclick="window.location.href='crediturbo.html'">
        <i class="bi bi-lightning-charge"></i>
      </div>
      <div class="nav-item" style="cursor:pointer;" onclick="window.location.href='config.html'">
        <i class="bi bi-gear"></i>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/auth.js"></script>
  <script>
    requireAuth();

    const user = getUser();
    const userName = user?.first_name || user?.email?.split('@')[0] || 'Usuario';

    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const btnSend = document.getElementById('btnSend');

    let history = [];

    function addBubble(text, role) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      if (role === 'bot') {
        const avatar = document.createElement('div');
        avatar.className = 'bot-avatar';
        avatar.innerHTML = '<i class="bi bi-robot"></i>';
        row.appendChild(avatar);
      }

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${role}`;
      bubble.textContent = text;
      row.appendChild(bubble);
      chatMessages.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.id = 'typingRow';
      const avatar = document.createElement('div');
      avatar.className = 'bot-avatar';
      avatar.innerHTML = '<i class="bi bi-robot"></i>';
      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<span></span><span></span><span></span>';
      row.appendChild(avatar);
      row.appendChild(indicator);
      chatMessages.appendChild(row);
      scrollToBottom();
    }

    function hideTyping() {
      const row = document.getElementById('typingRow');
      if (row) row.remove();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || btnSend.disabled) return;

      addBubble(text, 'user');
      messageInput.value = '';
      messageInput.style.height = 'auto';
      btnSend.disabled = true;
      showTyping();

      history.push({ role: 'user', content: text });

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: history.slice(-10) })
        });
        const data = await res.json();
        hideTyping();
        const reply = data.reply || 'No pude responder en este momento.';
        addBubble(reply, 'bot');
        history.push({ role: 'assistant', content: reply });
      } catch {
        hideTyping();
        addBubble('Error de conexión. Intenta de nuevo.', 'bot');
      }

      btnSend.disabled = false;
      messageInput.focus();
    }

    btnSend.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    });

    // Sidebar
    const sidebar = document.getElementById("mobileSidebar");
    const overlay = document.getElementById("menuOverlay");
    const closeSidebar = document.getElementById("closeSidebar");
    const menuToggle = document.getElementById("menuToggle");
    const closeMenu = () => { sidebar.classList.remove("active"); overlay.classList.remove("active"); };
    if (menuToggle) menuToggle.addEventListener("click", () => { sidebar.classList.add("active"); overlay.classList.add("active"); });
    if (closeSidebar) closeSidebar.addEventListener("click", closeMenu);
    if (overlay) overlay.addEventListener("click", closeMenu);

    // Mensaje de bienvenida con nombre real
    addBubble(`¡Hola, ${userName}! 👋 Soy Tidi, tu asistente financiero personal. ¿En qué puedo ayudarte hoy? Puedes preguntarme sobre gastos, ahorros, presupuestos o cualquier duda financiera.`, 'bot');
    messageInput.focus();
  </script>
  <script src="/public/js/pwa-handler.js"></script>
</body>

</html>
