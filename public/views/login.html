<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Login - Tidi AI</title>
    <link rel="stylesheet" href="/public/css/login.css">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-xl-9 login-container">
            <div class="row h-100">
                
                <div class="col-lg-5 brand-side d-none d-lg-flex">
                    <a href="../index.html" class="logo-text">
                        <img src="../assets/img/logo.png" alt="Logo" style="width: 40px; height: auto;" class="me-2"> Tidi
                    </a>
                    <h1 class="fw-bold mb-4">Welcome back!</h1>
                    <p class="opacity-75 mb-5">Your AI assistant has missed you. Log in to check your latest financial predictions.</p>
                    
                    <div class="mt-auto">
                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-shield-lock-fill me-3"></i>
                            <span>Secure Access</span>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7 form-side">
                    <div class="mb-4 d-lg-none text-center">
                        <img src="../assets/img/logo.png" alt="Logo" style="width: 50px;" class="mb-2">
                        <h3 class="fw-bold" style="color: var(--primary-blue);">Tidi</h3>
                    </div>
                    
                    <h2 class="fw-bold mb-2">Login</h2>
                    <p class="text-muted mb-4">New to Tidi? <a href="register.html" class="text-decoration-none fw-bold" style="color: var(--primary-blue);">Create an account</a></p>

                    <form>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label class="form-label small fw-bold">Password</label>
                            </div>
                            <input type="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-login mb-4">Login</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
