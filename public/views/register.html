<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Join Tidi - Start Your AI Journey</title>
    <style>
        :root {
            --primary-blue: #3b44f6;
            --dark-navy: #0a0c1a;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .register-container {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            min-height: 600px;
        }

        .brand-side {
            background-color: var(--primary-blue);
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-side {
            padding: 60px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 20px;
            border: 1px solid #e1e5ee;
            background-color: #fdfdff;
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem rgba(59, 68, 246, 0.1);
        }

        .btn-register {
            background-color: var(--primary-blue);
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-register:hover {
            background-color: #2a33d1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 68, 246, 0.3);
        }

        .social-btn {
            border-radius: 12px;
            border: 1px solid #e1e5ee;
            padding: 10px;
            transition: all 0.2s;
            background: white;
        }

        .social-btn:hover {
            background-color: #f8f9fa;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-xl-10 register-container">
                <div class="row h-100">

                    <div class="col-lg-5 brand-side d-none d-lg-flex">
                        <a href="../index.html" class="logo-text d-flex align-items-center">
                            <img src="../assets/img/logo.png" alt="Tidi Logo" style="width: 40px; height: auto;"
                                class="me-2"> Tidi
                        </a>
                        <h1 class="fw-bold mb-4">Start predicting your financial future.</h1>
                        <p class="opacity-75 mb-5">Join over 10,000 users who have already automated their savings and
                            optimized their daily spending with AI.</p>

                        <div class="mt-auto">
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-check-circle-fill me-3"></i>
                                <span>Smart AI Budgeting</span>
                            </div>
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-check-circle-fill me-3"></i>
                                <span>Bank-level Encryption</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <i class="bi bi-check-circle-fill me-3"></i>
                                <span>Real-time Alerts</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7 form-side">
                        <div class="mb-4 d-lg-none">
                            <h3 class="fw-bold text-primary">Tidi</h3>
                        </div>

                        <h2 class="fw-bold mb-2">Create an account</h2>
                        <p class="text-muted mb-4">Already have an account? <a href="../views/login.html"
                                class="text-decoration-none fw-bold" style="color: var(--primary-blue);">Log in</a></p>

                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">First Name</label>
                                    <input type="text" class="form-control" placeholder="John" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Last Name</label>
                                    <input type="text" class="form-control" placeholder="Doe" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold">Email Address</label>
                                    <input type="email" class="form-control" placeholder="name@example.com" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold">Password</label>
                                    <input type="password" class="form-control" placeholder="Min. 8 characters" required>
                                </div>
                                <div class="col-12">
                                    <div class="form-check small">
                                        <input class="form-check-input" type="checkbox" id="terms" required>
                                        <label class="form-check-label text-muted" for="terms">
                                            I agree to the <a href="#" class="text-decoration-none">Terms of Service</a>
                                            and <a href="#" class="text-decoration-none">Privacy Policy</a>.
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary w-100 btn-register">Create
                                        Account</button>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
