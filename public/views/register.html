<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Join Tidi - Start Your AI Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/public/css/register.css">
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-xl-10 register-container">
                <div class="row h-100">

                    <div class="col-lg-5 brand-side d-none d-lg-flex">
                        <a href="../index.html" class="logo-text d-flex align-items-center">
                            <img src="../assets/img/logo.png" alt="Tidi Logo" style="width: 40px; height: auto;"
                                class="me-2"> Tidi
                        </a>
                        <h1 class="fw-bold mb-4">Start predicting your financial future.</h1>
                        <p class="opacity-75 mb-5">Join over 10,000 users who have already automated their savings and
                            optimized their daily spending with AI.</p>

                        <div class="mt-auto">
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-check-circle-fill me-3"></i>
                                <span>Smart AI Budgeting</span>
                            </div>
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-check-circle-fill me-3"></i>
                                <span>Bank-level Encryption</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <i class="bi bi-check-circle-fill me-3"></i>
                                <span>Real-time Alerts</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7 form-side position-relative">
                        <button class="theme-toggle btn btn-link text-decoration-none position-absolute top-0 end-0 p-4 text-secondary" style="z-index: 10;">
                            <span class="material-symbols-outlined fs-4">light_mode</span>
                        </button>
                        <div class="mb-4 d-lg-none">
                            <h3 class="fw-bold text-primary">Tidi</h3>
                        </div>

                        <h2 class="fw-bold mb-2">Create an account</h2>
                        <p class="text-muted mb-4">Already have an account? <a href="../views/login.html"
                                class="text-decoration-none fw-bold" style="color: var(--primary-blue);">Log in</a></p>

                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">First Name</label>
                                    <input type="text" class="form-control" placeholder="John" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Last Name</label>
                                    <input type="text" class="form-control" placeholder="Doe" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold">Email Address</label>
                                    <input type="email" class="form-control" placeholder="name@example.com" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold">Password</label>
                                    <input type="password" class="form-control" placeholder="Min. 8 characters" required>
                                </div>
                                <div class="col-12">
                                    <div class="form-check small">
                                        <input class="form-check-input" type="checkbox" id="terms" required>
                                        <label class="form-check-label text-muted" for="terms">
                                            I agree to the <a href="#" class="text-decoration-none">Terms of Service</a>
                                            and <a href="#" class="text-decoration-none">Privacy Policy</a>.
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary w-100 btn-register">Create
                                        Account</button>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/theme-toggle.js"></script>
</body>

</html>
