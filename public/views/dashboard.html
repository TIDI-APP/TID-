<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Tidi Dashboard - Responsive Chat</title>
    <style>
        :root {
            --primary-blue: #3b44f6;
            --bg-light: #f4f7fe;
            --sidebar-width: 280px;
        }

        body { background-color: var(--bg-light); font-family: 'Segoe UI', sans-serif; }

        /* Sidebar Logic */
        .sidebar {
            width: var(--sidebar-width); height: 100vh; background: white;
            position: fixed; left: 0; top: 0; border-right: 1px solid #e0e0e0;
            padding: 2rem 1.5rem; z-index: 1050; transition: all 0.3s ease;
        }

        .main-content { margin-left: var(--sidebar-width); padding: 2rem; transition: all 0.3s ease; }

        /* Mobile Sidebar */
        @media (max-width: 991.98px) {
            .sidebar { left: calc(var(--sidebar-width) * -1); }
            .sidebar.show { left: 0; }
            .main-content { margin-left: 0; padding: 1rem; }
        }

        /* Nav Links */
        .nav-link { color: #6c757d; padding: 0.8rem 1rem; border-radius: 12px; margin-bottom: 0.5rem; display: flex; align-items: center; text-decoration: none; }
        .nav-link.active, .nav-link:hover { background-color: rgba(59, 68, 246, 0.1); color: var(--primary-blue); }

        /* Cards */
        .stat-card { background: white; border: none; border-radius: 20px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03); height: 100%; }

        /* --- Chatbot Responsivo Logic --- */
        .chat-container { height: 400px; display: flex; flex-direction: column; }
        .chat-messages { flex-grow: 1; padding: 1rem; overflow-y: auto; background: #f8f9fa; border-radius: 15px; margin-bottom: 1rem; }

        /* Floating Button for Mobile */
        #chatFloatingBtn {
            position: fixed; bottom: 20px; right: 20px;
            width: 60px; height: 60px; border-radius: 50%;
            background-color: var(--primary-blue); color: white;
            display: none; align-items: center; justify-content: center;
            font-size: 1.5rem; box-shadow: 0 4px 15px rgba(59, 68, 246, 0.4);
            z-index: 2000; border: none;
        }

        /* Chat Modal/Popup on Mobile */
        @media (max-width: 1199.98px) {
            .chat-section-desktop { display: none; } /* Ocultar en el grid */
            #chatFloatingBtn { display: flex; }      /* Mostrar botón flotante */
        }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1040; }
        .sidebar-overlay.show { display: block; }
    </style>
</head>
<body>

    <div class="d-lg-none p-3 bg-white border-bottom d-flex justify-content-between align-items-center sticky-top">
        <div class="d-flex align-items-center">
            <span class="fw-bold text-primary">Tidi AI</span>
        </div>
        <button class="btn btn-primary" id="btnToggle"><i class="bi bi-list"></i></button>
    </div>

    <div class="sidebar-overlay" id="overlay"></div>

    <nav class="sidebar" id="sidebar">
        <div class="nav flex-column">
            <a href="#" class="nav-link active"><i class="bi bi-grid-1x2-fill me-2"></i> Overview</a>
            <a href="#" class="nav-link"><i class="bi bi-clock-history me-2"></i> History</a>
            <a href="#" class="nav-link"><i class="bi bi-person-circle me-2"></i> Profile</a>
            <hr>
            <a href="#" class="nav-link text-danger"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">Overview</h2>
            <div class="bg-secondary rounded-circle" style="width: 40px; height: 40px; opacity: 0.1;"></div>
        </div>

        <div class="row g-2 mb-5">
            <div class="col-6 col-md-3"><button class="btn btn-primary w-100 py-3 rounded-4 fw-bold">Income</button></div>
            <div class="col-6 col-md-3"><button class="btn btn-danger w-100 py-3 rounded-4 fw-bold">Expense</button></div>
            <div class="col-6 col-md-3"><button class="btn btn-dark w-100 py-3 rounded-4 fw-bold">Balance</button></div>
            <div class="col-6 col-md-3"><button class="btn btn-outline-primary w-100 py-3 rounded-4 fw-bold">Profile</button></div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-12 col-md-4"><div class="stat-card"> <small class="text-muted fw-bold">BALANCE</small><h2 class="fw-bold mt-2">$ 0.00</h2></div></div>
            <div class="col-12 col-md-4"><div class="stat-card"> <small class="text-muted fw-bold text-success">INCOME</small><h2 class="fw-bold mt-2 text-success">$ 0.00</h2></div></div>
            <div class="col-12 col-md-4"><div class="stat-card"> <small class="text-muted fw-bold text-danger">EXPENSES</small><h2 class="fw-bold mt-2 text-danger">$ 0.00</h2></div></div>
        </div>

        <div class="row g-4">
            <div class="col-12 col-xl-8">
                <div class="stat-card">
                    <h5 class="fw-bold mb-4">Transaction History</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="text-muted small"><tr><th>CONCEPT</th><th>DATE</th><th>AMOUNT</th></tr></thead>
                            <tbody><tr><td colspan="3" class="text-center py-5 text-muted">No records.</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-4 chat-section-desktop">
                <div class="stat-card">
                    <h5 class="fw-bold mb-3"><i class="bi bi-robot text-primary me-2"></i>TidiBOT</h5>
                    <div class="chat-container">
                        <div class="chat-messages text-center text-muted small pt-5">Waiting for your input...</div>
                        <div class="input-group">
                            <input type="text" class="form-control bg-light border-0" placeholder="Ask something...">
                            <button class="btn btn-primary"><i class="bi bi-send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <button id="chatFloatingBtn" data-bs-toggle="modal" data-bs-target="#chatModal">
        <i class="bi bi-robot"></i>
    </button>

    <div class="modal fade" id="chatModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-robot text-primary me-2"></i>TidiBOT</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="chat-container" style="height: 300px;">
                        <div class="chat-messages text-center text-muted small pt-5">Waiting for your input...</div>
                        <div class="input-group mt-2">
                            <input type="text" class="form-control bg-light border-0" placeholder="Ask something...">
                            <button class="btn btn-primary"><i class="bi bi-send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sidebar Toggle
        const btnToggle = document.getElementById('btnToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        }

        btnToggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
