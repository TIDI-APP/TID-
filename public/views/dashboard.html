<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIDI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/dashboard.css">
</head>

<body>

  <!-- Overlay -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- SIDEBAR DESKTOP -->
  <div class="desktop-sidebar d-none d-lg-block">
    <div class="sidebar-header">
      <h5>Tidi</h5>
    </div>

    <div class="sidebar-links">
      <a href="#"><i class="bi bi-robot"></i> Chatbot</a>
      <a href="#"><i class="bi bi-piggy-bank"></i> Baul</a>
      <a href="#" id="botonCreditoPersonalizado" ><i class="bi bi-lightning-charge"></i> Crediturbo</a>
      <a href="#"><i class="bi bi-gear"></i> Configuración</a>
    </div>
  </div>


  <!-- SIDEBAR MOBILE -->
  <div class="mobile-sidebar" id="mobileSidebar">
    <div class="sidebar-header">
      <h5>Tidi</h5>
      <i class="bi bi-x-lg close-btn" id="closeSidebar"></i>
    </div>

    <div class="sidebar-links">
      <a href="#"><i class="bi bi-robot"></i> Chatbot</a>
      <a href="#"><i class="bi bi-piggy-bank"></i> Baul</a>
      <a href="#"><i class="bi bi-lightning-charge"></i> Crediturbo</a>
      <a href="#"><i class="bi bi-gear"></i> Configuración</a>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="app-content">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center">
      <i class="bi bi-list d-lg-none" id="menuToggle" style="font-size:26px; cursor:pointer;"></i>

      <h5>Hola, Jhonatan</h5>

      <button id="themeToggle" class="btn btn-sm btn-outline-light">
        <i class="bi bi-moon"></i>
      </button>
    </div>

    <!-- Balance -->
    <div class="row mt-4 g-4 fade-in">

      <div class="balance mt-4 fade-in">
        <h6>Balance Total</h6>
        <h2 id="balanceValue">$0.00</h2>
      </div>



      <div class="col-6">
        <div class="card-custom text-center h-100" id="openIncome">
          <i class="bi bi-arrow-down-circle fs-2 text-success mb-2"></i>
          <h6>Ingresos</h6>
          <h4 class="text-success"></h4>
          <small class="opacity-50"></small>
        </div>
      </div>

      <div class="col-6">
        <div class="card-custom text-center h-100" id="openExpense">
          <i class="bi bi-arrow-up-circle fs-2 text-danger mb-2"></i>
          <h6>Gastos</h6>
          <h4 class="text-danger"></h4>
          <small class="opacity-50"></small>
        </div>
      </div>

    </div>


    <div class="mt-5 fade-in">
      <h5 class="mb-3">Transacciones anteriores</h5>

      <div class="card-custom mb-3 d-flex justify-content-between align-items-center">
        <div>
          <strong>Netflix</strong>
          <div class="small opacity-50">Suscripción</div>
        </div>
        <span class="text-danger">- $15.99</span>
      </div>

      <div class="card-custom mb-3 d-flex justify-content-between align-items-center">
        <div>
          <strong>Nómina</strong>
          <div class="small opacity-50">Ingreso mensual</div>
        </div>
        <span class="text-success">+ $2,500</span>
      </div>

      <div class="card-custom d-flex justify-content-between align-items-center">
        <div>
          <strong>Mercado</strong>
          <div class="small opacity-50">Supermercado</div>
        </div>
        <span class="text-danger">- $120.40</span>
      </div>
    </div>

    <!-- IA Button -->

    <div class="voice-sheet" id="voiceSheet">
      <div class="text-center">
        <h5>Escuchando...</h5>
        <div class="d-flex justify-content-center mt-4">
          <div class="wave"></div>
          <div class="wave"></div>
          <div class="wave"></div>
          <div class="wave"></div>
        </div>
      </div>
    </div>


    <!-- Bottom Bar -->
    <div class="bottom-container d-lg-none">

      <div class="bottom-bar">

        <div class="nav-item">
          <i class="bi bi-robot"></i>
        </div>

        <div class="nav-item">
          <i class="bi bi-cash-stack"></i>
        </div>

        <div class="spacer"></div>

        <div class="nav-item">
          <i class="bi bi-graph-down"></i>
        </div>

        <div class="nav-item">
          <i class="bi bi-person"></i>
        </div>

      </div>

      <!-- Botón montaña separado -->
      <div class="mic-floating" id="iaButton">
        <i class="bi bi-mic-fill"></i>
      </div>

    </div>

    <!-- MODAL FINANZAS PRO -->
    <div class="modal fade" id="financeModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">

          <div class="modal-header border-0">
            <h5 class="modal-title" id="modalTitle">Ver Ingresos</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <button class="btn btn-gradient w-100 mb-4" id="addButton">
              Agregar Ingreso
            </button>

            <form id="financeForm" class="finance-form">

              <div class="form-floating mb-3">
                <input type="text" class="form-control custom-input" placeholder="Título" required>
                <label>Título</label>
              </div>

              <div class="form-floating mb-3">
                <input type="number" class="form-control custom-input" placeholder="Monto" required>
                <label>Monto</label>
              </div>

              <div class="form-floating mb-3">
                <select class="form-select custom-input">
                  <option>Seleccioanr...</option>
                  <option>Salario</option>
                  <option>Comida</option>
                  <option>Transporte</option>
                  <option>Otros</option>
                </select>
              </div>

              <button type="submit" class="btn btn-success-custom w-100">
                Guardar
              </button>

            </form>

          </div>
        </div>
      </div>
    </div>



    <div class="modal"id="creditModal" >
      <div>
        
      </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/public/js/dashboard.js"></script>

</body>

</html>
