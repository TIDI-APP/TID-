<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transacciones – TIDI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/dashboard.css">
  <link rel="manifest" href="/public/manifest.json">
  <link rel="apple-touch-icon" href="/public/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#6840f3">
</head>

<body>

  <!-- Overlay -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- SIDEBAR DESKTOP -->
  <div class="desktop-sidebar d-none d-lg-block">
    <div class="sidebar-header">
      <h5>Tidi</h5>
    </div>
    <div class="sidebar-links">
      <a href="dashboard.html"><i class="bi bi-house"></i> <span data-i18n="nav.home">Inicio</span></a>
      <a href="chatbot.html"><i class="bi bi-robot"></i> <span data-i18n="nav.chatbot">Chatbot</span></a>
      <a href="transactions.html" class="active"><i class="bi bi-list-ul"></i> <span data-i18n="nav.transactions">Transacciones</span></a>
      <a href="crediturbo.html"><i class="bi bi-lightning-charge"></i> <span data-i18n="nav.crediturbo">Crediturbo</span></a>
      <a href="config.html"><i class="bi bi-gear"></i> <span data-i18n="nav.settings">Configuración</span></a>
      <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right"></i> <span data-i18n="nav.logout">Cerrar Sesión</span></a>
    </div>
  </div>

  <!-- SIDEBAR MOBILE -->
  <div class="mobile-sidebar" id="mobileSidebar">
    <div class="sidebar-header">
      <h5>Tidi</h5>
      <i class="bi bi-x-lg close-btn" id="closeSidebar"></i>
    </div>
    <div class="sidebar-links">
      <a href="dashboard.html"><i class="bi bi-house"></i> <span data-i18n="nav.home">Inicio</span></a>
      <a href="chatbot.html"><i class="bi bi-robot"></i> <span data-i18n="nav.chatbot">Chatbot</span></a>
      <a href="transactions.html" class="active"><i class="bi bi-list-ul"></i> <span data-i18n="nav.transactions">Transacciones</span></a>
      <a href="crediturbo.html"><i class="bi bi-lightning-charge"></i> <span data-i18n="nav.crediturbo">Crediturbo</span></a>
      <a href="config.html"><i class="bi bi-gear"></i> <span data-i18n="nav.settings">Configuración</span></a>
      <a href="#" onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right"></i> <span data-i18n="nav.logout">Cerrar Sesión</span></a>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="app-content">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <i class="bi bi-list d-lg-none" id="menuToggle" style="font-size:26px; cursor:pointer;"></i>
        <a href="dashboard.html" class="text-decoration-none opacity-75 d-flex align-items-center gap-1" style="color: var(--text);">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h5 class="mb-0" data-i18n="tx.title">Transacciones</h5>
      </div>
      <button id="themeToggle" class="btn btn-sm btn-outline-light">
        <i class="bi bi-moon"></i>
      </button>
    </div>

    <!-- FILTERS -->
    <div class="card-custom mb-4 fade-in">
      <div class="row g-3">
        <div class="col-12 col-sm-4">
          <label class="small opacity-50 mb-1" data-i18n="tx.type">Tipo</label>
          <select id="filterTipo" class="form-select custom-input">
            <option value="" data-i18n="tx.all">Todos</option>
            <option value="ingreso" data-i18n="tx.income">Ingresos</option>
            <option value="gasto" data-i18n="tx.expenses">Gastos</option>
            <option value="modificacion de balance" data-i18n="tx.balanceAdj">Ajustes de balance</option>
          </select>
        </div>
        <div class="col-6 col-sm-4">
          <label class="small opacity-50 mb-1" data-i18n="tx.from">Desde</label>
          <input type="date" id="filterDesde" class="form-control custom-input">
        </div>
        <div class="col-6 col-sm-4">
          <label class="small opacity-50 mb-1" data-i18n="tx.to">Hasta</label>
          <input type="date" id="filterHasta" class="form-control custom-input">
        </div>
      </div>
      <div class="d-flex gap-2 mt-3">
        <button id="btnFiltrar" class="btn btn-gradient rounded-pill px-4 py-2 text-white fw-semibold flex-grow-1">
          <i class="bi bi-funnel me-1"></i> <span data-i18n="tx.filter">Filtrar</span>
        </button>
        <button id="btnLimpiar" class="btn rounded-pill px-3 py-2 opacity-75" style="background: rgba(255,255,255,0.05); color: var(--text);">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- FILTER SUMMARY -->
    <div id="filterSummary" class="small opacity-50 mb-3 text-center" style="display:none;"></div>

    <!-- TRANSACTION LIST -->
    <div id="txList">
      <div class="text-center py-5 opacity-50">
        <i class="bi bi-hourglass-split fs-2 mb-2 d-block"></i>
        <span data-i18n="tx.loading">Cargando...</span>
      </div>
    </div>

    <!-- EMPTY STATE -->
    <p class="text-center opacity-50 small mt-4" id="noTx" style="display:none;" data-i18n="tx.noTx">No hay transacciones para este filtro</p>

  </div>

  <!-- Bottom Bar -->
  <div class="bottom-container d-lg-none">
    <div class="bottom-bar">
      <div class="nav-item" style="cursor:pointer;" onclick="window.location.href='dashboard.html'">
        <i class="bi bi-house"></i>
      </div>
      <div class="nav-item" style="cursor:pointer; color: var(--primary-light);">
        <i class="bi bi-list-ul"></i>
      </div>
      <div class="spacer"></div>
      <div class="nav-item" style="cursor:pointer;" onclick="window.location.href='crediturbo.html'">
        <i class="bi bi-lightning-charge"></i>
      </div>
      <div class="nav-item" style="cursor:pointer;" onclick="window.location.href='config.html'">
        <i class="bi bi-gear"></i>
      </div>
    </div>
  </div>

  <!-- TRANSACTION DETAIL MODAL -->
  <div class="modal fade" id="txDetailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content custom-modal border-0 shadow-lg p-3">
        <div class="modal-header border-0 pb-0 justify-content-end">
          <button type="button" class="btn-close btn-close-white opacity-50" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-0 text-center">
          <div id="detailIcon" class="mb-3"></div>
          <h5 id="detailTitulo" class="fw-bold mb-1"></h5>
          <p id="detailCategoria" class="small opacity-50 mb-3"></p>
          <div class="card-custom text-start mb-3" style="background: rgba(255,255,255,0.04);">
            <div class="d-flex justify-content-between mb-2">
              <span class="small opacity-50" data-i18n="tx.amount">Monto</span>
              <span id="detailValor" class="fw-bold"></span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span class="small opacity-50" data-i18n="tx.type">Tipo</span>
              <span id="detailTipo" class="small"></span>
            </div>
            <div class="d-flex justify-content-between">
              <span class="small opacity-50" data-i18n="tx.date">Fecha</span>
              <span id="detailFecha" class="small"></span>
            </div>
          </div>
          <button id="btnDeleteTx" class="btn w-100 rounded-pill py-2 fw-semibold" style="background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3);">
            <i class="bi bi-trash3 me-1"></i> <span data-i18n="tx.delete">Eliminar transacción</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/i18n.js"></script>
  <script src="/public/js/transactions.js"></script>
  <script src="/public/js/pwa-handler.js"></script>
</body>
</html>
